<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umoja Health Connect — Health Education</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body onload="initHealthEducation()">
  <header>
    <div class="brand">Umoja Health Connect</div>
    <nav>
      <select id="language-select" class="lang-select">
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="sw">SW</option>
        <option value="ar">AR</option>
      </select>
      <button id="logout-btn" data-i18n="logout">Log out</button>
    </nav>
  </header>

  <main>
    <div class="card wide">
      <div class="tabs">
        <a href="dashboard.html" data-i18n="profile">Profile</a>
        <a href="appointments.html" data-i18n="appointments">Appointments</a>
        <a href="records.html" data-i18n="medical_records">Medical Records</a>
        <a href="symptom-report.html" data-i18n="report_symptoms">Report Symptoms</a>
        <a href="health-education.html" class="active" data-i18n="health_education">Health Education</a>
      </div>

      <div class="section-header">
        <h1 data-i18n="health_ed_heading">Health education library</h1>
        <button class="secondary" id="download-offline-btn" data-i18n="download_offline">Download for offline</button>
      </div>
      <div id="offline-message" class="message"></div>

      <div id="article-list"></div>
    </div>
  </main>

  <div class="modal-overlay" id="article-modal">
    <div class="modal">
      <h1 id="article-title"></h1>
      <p id="article-body" style="white-space: pre-wrap;"></p>
      <div class="modal-actions">
        <button type="button" class="secondary" id="article-modal-close" data-i18n="cancel">Close</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="i18n.js"></script>
  <script src="emergency.js"></script>
</body>
</html>
