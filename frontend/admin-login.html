<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umoja Health Connect — Admin Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">Umoja Health Connect — Admin</div>
  </header>

  <main>
    <div class="auth-decor" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="card">
      <h1>Administrator login</h1>
      <p style="color: var(--muted); font-size: 0.85rem; margin-top: -0.5rem;">
        Administrator accounts are provisioned by the platform team — there is no self-registration.
      </p>
      <div id="message" class="message"></div>
      <form onsubmit="handleAdminLogin(event)">
        <div class="field">
          <label for="phone_number">Phone number</label>
          <input type="tel" id="phone_number" name="phone_number" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" required />
            <button type="button" class="password-toggle" data-target="password" aria-label="Show password">
              <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="primary">Log in</button>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
