<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umoja Health Connect — Report Symptoms</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body onload="initSymptomReport()">
  <header>
    <div class="brand">Umoja Health Connect</div>
    <nav>
      <select id="language-select" class="lang-select">
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="sw">SW</option>
        <option value="ar">AR</option>
      </select>
      <button id="logout-btn">Log out</button>
    </nav>
  </header>

  <main>
    <div class="card wide">
      <div class="tabs">
        <a href="dashboard.html">Profile</a>
        <a href="appointments.html">Appointments</a>
        <a href="records.html">Medical Records</a>
        <a href="symptom-report.html" class="active">Report Symptoms</a>
        <a href="health-education.html">Health Education</a>
      </div>

      <h1>Report your symptoms</h1>
      <p style="color: var(--muted); font-size: 0.9rem; margin-top: -0.5rem;">
        Choose everything that applies, and add anything else in your own words. A verified
        healthcare provider will be assigned to your case automatically.
      </p>
      <div id="message" class="message"></div>

      <form id="symptom-form">
        <div class="symptom-checklist" id="symptom-checklist">
          <label><input type="checkbox" value="Fever" /> Fever</label>
          <label><input type="checkbox" value="Cough" /> Cough</label>
          <label><input type="checkbox" value="Headache" /> Headache</label>
          <label><input type="checkbox" value="Diarrhea" /> Diarrhea</label>
          <label><input type="checkbox" value="Vomiting" /> Vomiting</label>
          <label><input type="checkbox" value="Body aches" /> Body aches</label>
          <label><input type="checkbox" value="Difficulty breathing" /> Difficulty breathing</label>
          <label><input type="checkbox" value="Rash" /> Rash</label>
          <label><input type="checkbox" value="Bleeding" /> Bleeding</label>
          <label><input type="checkbox" value="Fatigue" /> Fatigue</label>
        </div>

        <div class="field">
          <label for="free_text">Describe in your own words (optional)</label>
          <input type="text" id="free_text" name="free_text" />
        </div>

        <button type="submit" class="primary">Submit report</button>
      </form>

      <h1 style="margin-top: 2rem;">Your consultations</h1>
      <div id="consultations-list"></div>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="i18n.js"></script>
  <script src="emergency.js"></script>
</body>
</html>
