<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umoja Health Connect — Volunteer Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">Umoja Health Connect — Volunteers</div>
    <nav>
      <select id="language-select" class="lang-select">
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="sw">SW</option>
        <option value="ar">AR</option>
      </select>
      <a href="volunteer-register.html" data-i18n="register">Register</a>
    </nav>
  </header>

  <main>
    <div class="auth-decor" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="card">
      <h1 data-i18n="volunteer_login_heading">Volunteer login</h1>
      <div id="message" class="message"></div>
      <form onsubmit="handleVolunteerLogin(event)">
        <div class="field">
          <label for="phone_number" data-i18n="phone_number">Phone number</label>
          <input type="tel" id="phone_number" name="phone_number" required />
        </div>
        <div class="field">
          <label for="password" data-i18n="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" required />
            <button type="button" class="password-toggle" data-target="password" aria-label="Show password">
              <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="primary" data-i18n="log_in_link">Log in</button>
      </form>
      <div class="alt-link">
        <span data-i18n="not_registered_yet">Not registered yet?</span> <a href="volunteer-register.html" data-i18n="register_here">Register here</a>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="i18n.js"></script>
  <script src="volunteer.js"></script>
</body>
</html>
