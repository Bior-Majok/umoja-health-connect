<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umoja Health Connect — Appointments</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body onload="initAppointments()">
  <header>
    <div class="brand">Umoja Health Connect</div>
    <nav>
      <select id="language-select" class="lang-select">
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="sw">SW</option>
        <option value="ar">AR</option>
      </select>
      <button id="logout-btn">Log out</button>
    </nav>
  </header>

  <main>
    <div class="card wide">
      <div class="tabs">
        <a href="dashboard.html">Profile</a>
        <a href="appointments.html" class="active">Appointments</a>
        <a href="records.html">Medical Records</a>
        <a href="symptom-report.html">Report Symptoms</a>
        <a href="health-education.html">Health Education</a>
      </div>

      <div class="section-header">
        <h1>Your appointments</h1>
        <button class="secondary" id="new-appointment-btn">+ New appointment</button>
      </div>

      <div id="appointments-list"></div>
    </div>
  </main>

  <div class="modal-overlay" id="appointment-modal">
    <div class="modal">
      <h1>Book an appointment</h1>
      <div id="appointment-message" class="message"></div>
      <form id="appointment-form">
        <div class="field">
          <label for="provider_id">Provider</label>
          <select id="provider_id" name="provider_id" required>
            <option value="" disabled selected>Loading verified providers...</option>
          </select>
        </div>
        <div class="field">
          <label for="clinic_name">Clinic</label>
          <input type="text" id="clinic_name" name="clinic_name" required />
        </div>
        <div class="field">
          <label for="scheduled_at">Date &amp; time</label>
          <input type="datetime-local" id="scheduled_at" name="scheduled_at" required />
        </div>
        <div class="field">
          <label for="notes">Notes (optional)</label>
          <input type="text" id="notes" name="notes" />
        </div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="appointment-modal-cancel">Cancel</button>
          <button type="submit" class="primary">Book appointment</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="i18n.js"></script>
  <script src="emergency.js"></script>
</body>
</html>
