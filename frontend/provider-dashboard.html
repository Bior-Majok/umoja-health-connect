<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umoja Health Connect — Provider Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body onload="initProviderDashboard()">
  <header>
    <div class="brand">Umoja Health Connect — Providers</div>
    <nav>
      <button id="logout-btn">Log out</button>
    </nav>
  </header>

  <main>
    <div class="card wide">
      <div class="tabs">
        <a href="provider-dashboard.html" class="active">Consultations</a>
        <a href="provider-appointments.html">Appointments</a>
        <a href="provider-alerts.html">Emergency Alerts</a>
      </div>

      <h1>Your consultation queue</h1>
      <div id="consultations-list"></div>
    </div>
  </main>

  <div class="modal-overlay" id="respond-modal">
    <div class="modal">
      <h1>Respond to consultation</h1>
      <div id="respond-message" class="message"></div>
      <form id="respond-form">
        <input type="hidden" id="respond-consultation-id" />
        <div class="field">
          <label for="response_notes">Response notes</label>
          <input type="text" id="response_notes" name="response_notes" required />
        </div>
        <div class="field">
          <label><input type="checkbox" id="mark_critical" name="mark_critical" /> Escalate as critical (creates an emergency alert)</label>
        </div>
        <div class="field">
          <label><input type="checkbox" id="close_case" name="close_case" /> Close this case</label>
        </div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="respond-modal-cancel">Cancel</button>
          <button type="submit" class="primary">Save response</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="provider.js"></script>
</body>
</html>
