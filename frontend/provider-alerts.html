<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Umoja Health Connect — Provider Emergency Alerts</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body onload="initProviderAlerts()">

  <script src="app.js"></script>
